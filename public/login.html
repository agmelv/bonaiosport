<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuvio Live Sports — Sign in</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
<style>
  :root { --bg:#0b0b0d; --panel:#151518; --line:#26262c; --text:#f2f2f4; --dim:#9a9aa4; --accent:#1668ff; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(22, 104, 255,.13), transparent 65%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .box {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 30px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .mark { font-size: 30px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; letter-spacing: -.01em; }
  p.sub { margin: 0 0 22px; color: var(--dim); font-size: 14px; }
  label { display:block; font-size: 12px; letter-spacing:.08em; text-transform: uppercase;
          color: var(--dim); font-weight: 600; margin-bottom: 7px; }
  input {
    width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 10px;
    background: #1f1f24; color: var(--text); border: 1px solid var(--line);
  }
  input:focus { outline: none; border-color: #3a3a44; }
  button {
    width: 100%; margin-top: 14px; font: inherit; font-size: 15px; font-weight: 650;
    padding: 11px 14px; border-radius: 10px; cursor: pointer; border: none;
    background: var(--accent); color: #fff;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #msg { margin-top: 14px; min-height: 20px; font-size: 14px; color: #ff8d90; }
</style>
</head>
<body>
  <form class="box" id="form">
    <div class="mark">🏟️</div>
    <h1>Nuvio Live Sports</h1>
    <p class="sub">Sign in to browse the catalog.</p>
    <label for="key">Password</label>
    <input id="key" type="password" autocomplete="current-password" autofocus>
    <button type="submit" id="go">Sign in</button>
    <div id="msg"></div>
  </form>

<script>
const form = document.getElementById('form');
const key = document.getElementById('key');
const go = document.getElementById('go');
const msg = document.getElementById('msg');

form.onsubmit = async e => {
  e.preventDefault();
  if (!key.value) return;
  go.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'x-auth-key': key.value }
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok && body.authenticated) {
      // Straight to the catalog, which is what someone signing in came for.
      location.replace('/');
      return;
    }
    msg.textContent = res.status === 429
      ? 'Too many attempts. Wait a few minutes.'
      : (body.error || 'That password was not accepted.');
  } catch (err) {
    msg.textContent = 'Cannot reach the server: ' + err.message;
  }
  go.disabled = false;
  key.select();
};
</script>
</body>
</html>
